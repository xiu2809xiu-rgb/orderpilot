name: Story
description: One piece of work for one branch and one pull request.
title: "<epic letter>-<number>: "
labels:
  - "type: story"
body:
  - type: markdown
    attributes:
      value: |
        Start the title with the story's key, such as `C-2:`, then its name. The backlog scripts match issues by that key.

        After you create the issue, add the `area:`, `priority:` and `req:` labels you pick below. A story is ready when it meets the [Definition of Ready](https://github.com/xiu2809xiu-rgb/orderpilot/blob/main/docs/agile/definitions-of-ready-and-done.md#definition-of-ready).
  - type: input
    id: epic
    attributes:
      label: Epic
      description: The epic this story sits under. Add it as a sub-issue of that epic.
      placeholder: "Epic C: Order workflows and approvals"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "area: 1 document AI and integration"
        - "area: 2 order workflows and approvals"
        - "area: 3 checks, tracker and insights"
        - "area: 4 controls and monitoring"
        - "area: team"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "priority: must"
        - "priority: should"
        - "priority: could"
    validations:
      required: true
  - type: dropdown
    id: estimate
    attributes:
      label: Estimate
      description: In story points. Sprints never cap the work, so points only help us size a story.
      options:
        - "1"
        - "2"
        - "3"
        - "5"
        - "8"
        - "13"
    validations:
      required: true
  - type: checkboxes
    id: requirements
    attributes:
      label: Module requirements
      description: Every feature traces to at least one of them.
      options:
        - label: "req: M1 design thinking"
        - label: "req: M2 GRS by design"
        - label: "req: M3 AI-assisted coding"
        - label: "req: M4 best practices"
        - label: "req: M5 team Git workflow"
        - label: "req: M6 deploy and monitor"
  - type: textarea
    id: what
    attributes:
      label: What and why
      description: Who needs this, and what it gives them.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Each one must be something a reviewer can check.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Stories this one needs first, and anything waiting on Spectra.
