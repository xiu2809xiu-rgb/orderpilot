# The verify job. Its name, "Lint, typecheck, test, build", is a required
# check on main, so it never changes. Later stories add steps to it: the
# diagrams check (P-16) and the slides check (P-25). The bundle budget (P-11)
# is in, after the build.
#
# No path filters: a required workflow that does not run leaves its check
# pending forever. Heavy jobs skip with job-level conditions instead.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    # MinIO is built from source (docker/minio), which takes a few minutes the
    # first time. It builds in the background while the checks below run.
    timeout-minutes: 25
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The samples history check reads every commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # The integration tests need PostgreSQL, Redis and MinIO. They run from the
      # same docker-compose.yml as on a laptop, so the versions cannot drift
      # apart, with the safe defaults from .env.example. This only starts the
      # build; "Wait for the local stack" below waits for it.
      - name: Start the local stack in the background
        run: |
          cp .env.example .env
          nohup docker compose up -d --build > "$RUNNER_TEMP/stack.log" 2>&1 &

      - name: Samples history check
        run: node scripts/check-samples.mjs --history

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high and critical)
        run: pnpm audit --audit-level high

      - name: Format
        run: pnpm format:check

      - name: Em-dash check
        run: pnpm check:dashes

      - name: Licence-key and env-file guard
        run: pnpm check:licence-key

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Wait for the local stack
        run: |
          docker compose up -d --wait
          docker compose ps

      # Unit tests and the integration tests (real database, Redis and storage).
      # A failed connection fails the job: nothing is skipped.
      - name: Test
        run: pnpm test

      - name: Local stack logs (when a step failed)
        if: failure()
        run: |
          cat "$RUNNER_TEMP/stack.log" || true
          docker compose logs --tail 40 || true

      - name: Build
        run: pnpm build

      - name: Bundle budget (initial JS, 250 KB gzip)
        run: pnpm budget
