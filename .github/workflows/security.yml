# The security scans. The three job names are required checks on main, so
# they never change. docs/security/security-testing.md says what each finds
# and how we triage it; ADR 0006 records why these tools.
#
# No path filters, for the same reason as ci.yml. Each scanner is pinned: the
# actions by commit SHA, the Semgrep image by digest, and the gitleaks and
# OSV-Scanner downloads by version and SHA-256.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 06:30 Singapore time, so new advisories surface on a quiet main.
    - cron: "30 22 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan with the default, TypeScript, React, Node and OWASP Top 10 rules
        run: >-
          semgrep scan
          --config p/default
          --config p/typescript
          --config p/react
          --config p/nodejs
          --config p/owasp-top-ten
          --metrics off
          --error
          --sarif-output semgrep.sarif

      - name: Keep the report for triage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 14
          if-no-files-found: ignore

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan every commit in the history
        run: >-
          "$RUNNER_TEMP/gitleaks" git
          --redact
          --verbose
          --exit-code 1
          --report-format sarif
          --report-path gitleaks.sarif
          .

      - name: Keep the report for triage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 14
          if-no-files-found: ignore

  osv:
    name: Dependency scan (OSV)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OSV_SCANNER_VERSION: 2.7.0
      OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OSV-Scanner
        run: |
          curl -sSfL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
          "$RUNNER_TEMP/osv-scanner" --version

      # osv-scanner.toml lists the accepted advisories, each with a reason and
      # a date after which it fails again.
      - name: Scan the lockfile
        run: >-
          "$RUNNER_TEMP/osv-scanner" scan source
          --config osv-scanner.toml
          --lockfile pnpm-lock.yaml
