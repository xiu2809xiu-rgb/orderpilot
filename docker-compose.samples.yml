# A throwaway stack for trying a client sample. Only this machine can reach it,
# it cannot reach anything outside, and nothing it holds outlives it.
#
#   pnpm samples:up      build and start, then open http://localhost:8081
#   pnpm samples:down    stop and remove everything, the data with it
#
# What makes it safe to use with a sample (see samples/README.md first):
#   - It is its own compose project, so it shares no container, volume or network
#     with the normal stack, and the two can run side by side.
#   - Every store keeps its data in memory (tmpfs), so `down` leaves nothing on
#     disk, and there are no named volumes to forget.
#   - All services sit on an internal network with no route out: no document can
#     reach an AI provider or anywhere else, whatever the code or a .env says.
#   - Only the web app has a host port, bound to 127.0.0.1. The stores have none.
#   - samples/ is mounted read-only into the API and the worker, and is never in
#     an image: .dockerignore keeps it out of every build.
name: orderpilot-samples

x-sealed: &sealed
  restart: "no"
  ports: !reset []
  networks:
    - sealed

x-sealed-app: &sealed-app
  <<: *sealed
  volumes:
    - ./samples:/samples:ro

services:
  postgres:
    <<: *sealed
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql
  redis:
    <<: *sealed
    # Nothing to keep: the append-only log would only be written to memory.
    command: ["redis-server", "--appendonly", "no"]
    volumes: !reset []
    tmpfs:
      - /data
  minio:
    <<: *sealed
    volumes: !reset []
    tmpfs:
      # The image's unprivileged user owns its data folder.
      - /data:uid=10001,gid=10001
  mailpit:
    <<: *sealed
  migrate:
    restart: "no"
    networks:
      - sealed
  api:
    <<: *sealed-app
    environment:
      # The browser signs in from this stack's own port.
      CORS_ORIGINS: http://localhost:${SAMPLES_WEB_PORT:-8081},http://127.0.0.1:${SAMPLES_WEB_PORT:-8081}
  worker:
    <<: *sealed-app
  web:
    restart: "no"
    ports: !override
      - "127.0.0.1:${SAMPLES_WEB_PORT:-8081}:8080"
    # The internal network reaches the API. The second one exists only because
    # Docker cannot publish a port from an internal network alone.
    networks:
      - sealed
      - published

networks:
  sealed:
    internal: true
  published:
