# The whole stack: PostgreSQL (with pgvector), Redis, MinIO and Mailpit, then the
# migrations and the seed, then the API, the worker and the web app. Every port,
# name and password comes from the root .env (copy .env.example to .env), with
# the same safe defaults, so `docker compose up --build` works on a fresh clone,
# with no .env at all. Grafana's otel-lgtm and the mock services are extra, under
# the profiles "observability" and "mocks": they start only when asked for.
#
#   docker compose up --build       everything; the app opens on STACK_WEB_PORT
#   pnpm stack:up                   only the four stores, for `pnpm dev`
#   docker compose down             stop and remove the containers, keep the data
#
# Never add -v to `down`: it deletes the named volumes, and the data with them.
# Trying a client sample has its own throwaway stack: docker-compose.samples.yml.
name: orderpilot

# What the API, the worker and the migrations share. A container reaches the
# stores by service name, so these never come from the .env's 127.0.0.1 URLs.
# APP_ENV stays local: that is what lets plain http://localhost work without a
# real secret, and every port here is bound to this machine.
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  NODE_ENV: production
  DEMO_MODE: ${DEMO_MODE:-true}
  DEMO_STORYLINE: ${DEMO_STORYLINE:-false}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-orderpilot-demo-password}
  JWT_SECRET: ${JWT_SECRET:-local-development-secret-not-for-production-use}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # The end-to-end run raises both, because it signs in as every role within a
  # minute from one address (apps/e2e, ci.yml). Everyone else keeps the defaults.
  RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-300}
  AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-20}
  # nginx in the web container is the one proxy in front of the API.
  TRUST_PROXY_HOPS: 1
  CORS_ORIGINS: http://localhost:${STACK_WEB_PORT:-8080},http://127.0.0.1:${STACK_WEB_PORT:-8080}
  DATABASE_URL: postgresql://${POSTGRES_USER:-orderpilot}:${POSTGRES_PASSWORD:-orderpilot}@postgres:5432/${POSTGRES_DB:-orderpilot}
  REDIS_URL: redis://redis:6379/${REDIS_DB:-0}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-orderpilot}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-orderpilot-minio-secret}
  S3_BUCKET: ${S3_BUCKET:-orderpilot-documents}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-true}
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  # Off unless the .env sets them.
  METRICS_TOKEN:
  SENTRY_DSN:
  BANK_FINGERPRINT_KEY:
  # The AI gateway (P-17): the mock unless the .env chooses a provider. Keys
  # and the rest are passed through as they are, so an unset name stays unset.
  AI_PROVIDER: ${AI_PROVIDER:-mock}
  GEMINI_API_KEY:
  GROQ_API_KEY:
  AI_BASE_URL:
  AI_API_KEY:
  AI_MODEL:
  AI_VISION_MODEL:
  AI_STRUCTURED_OUTPUT:
  AI_TIMEOUT_MS:
  AI_MAX_ATTEMPTS:
  AI_MAX_TOOL_STEPS:
  AI_MAX_IMAGES_PER_REQUEST:
  AI_MAX_OUTPUT_TOKENS:
  AI_PRICE_INPUT_USD_PER_MTOK:
  AI_PRICE_OUTPUT_USD_PER_MTOK:
  AI_BEDROCK_REGION:
  AI_BEDROCK_ACCESS_KEY_ID:
  AI_BEDROCK_SECRET_ACCESS_KEY:
  AI_BEDROCK_SESSION_TOKEN:
  # Spark (P-95): what the stored data is, and its question limits. The origin
  # must reach the container, or "real" in the .env would be ignored and Spark
  # would declare real data synthetic. It is passed as it is, with no default
  # here: unset is synthetic away from production, and APP_ENV=production
  # refuses to start without it. The limits are passed as they are.
  DATA_ORIGIN:
  SPARK_QUESTIONS_PER_MINUTE:
  SPARK_QUESTIONS_PER_DAY:

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile
  target: runtime
  args:
    - GIT_SHA

# The api, worker, web and mock containers run with no privileges they do not
# use, on a read-only file system. /tmp is the one place they write. MinIO and
# migrate drop their privileges too but keep a writable file system: MinIO for
# its data, migrate for the Prisma CLI.
x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-stores-ready: &stores-ready
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy

services:
  postgres:
    # PostgreSQL 18 with the pgvector extension (ADR 0017). The migrations enable
    # vector and pg_trgm.
    image: pgvector/pgvector:0.8.6-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderpilot}
      POSTGRES_DB: ${POSTGRES_DB:-orderpilot}
    ports:
      # Bound to this machine only.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-orderpilot} -d ${POSTGRES_DB:-orderpilot}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    # Append-only, so queued jobs survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    build:
      context: ./docker/minio
    image: orderpilot/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orderpilot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orderpilot-minio-secret}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # The only place OrderPilot sends email in development and demos (ADR 0018):
  # it catches every message and shows it in a web page. Nothing leaves the stack.
  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One shot: applies the migrations, then the seed, which is safe to run again.
  # The API and the worker start only after it has exited with 0.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: orderpilot/api-migrate:local
    restart: "no"
    environment: *app-env
    depends_on: *stores-ready
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # The API has no host port: the browser reaches it through the web container,
  # so nothing here collides with a `pnpm dev` on the same machine. Its health
  # check is in the image and asks /health/ready.
  api:
    <<: *hardened
    build: *api-build
    image: orderpilot/api:local
    environment: *app-env
    depends_on:
      <<: *stores-ready
      mailpit:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The same image with another command. It has no port to ask, so the health
  # check reads the age of its heartbeat file.
  worker:
    <<: *hardened
    build: *api-build
    image: orderpilot/api:local
    command: ["node", "dist/worker/worker.js"]
    environment: *app-env
    healthcheck:
      test: ["CMD", "node", "dist/worker/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      <<: *stores-ready
      migrate:
        condition: service_completed_successfully

  # nginx with the production build. Its health check is in the image.
  web:
    <<: *hardened
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_SENTRY_DSN
    image: orderpilot/web:local
    ports:
      - "127.0.0.1:${STACK_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  # The template the mock services start from (docker/mock). P-19 adds
  # mock-business-central beside it. Off unless asked for, and only reached over the
  # compose network:
  #   docker compose --profile mocks up -d --build mock-template
  mock-template:
    <<: *hardened
    profiles: ["mocks"]
    build:
      context: .
      dockerfile: docker/mock/Dockerfile
      args:
        SERVICE: mock-template
    image: orderpilot/mock-template:local

  # Traces, metrics and logs in one container (ADR 0021): the OpenTelemetry
  # collector, Tempo, Prometheus, Loki and Grafana. Off unless asked for:
  #   docker compose --profile observability up -d otel-lgtm
  # Only an API started with `pnpm dev` sends to it, with OTEL_EXPORTER_OTLP_ENDPOINT
  # set in the .env (its 127.0.0.1 address means nothing inside a container, so
  # the containerised API does not export). Grafana then
  # opens at http://127.0.0.1:${GRAFANA_PORT} (user admin, password admin: a
  # laptop only, the port is bound to this machine).
  otel-lgtm:
    profiles: ["observability"]
    image: grafana/otel-lgtm:0.38.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - lgtm-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  lgtm-data:
