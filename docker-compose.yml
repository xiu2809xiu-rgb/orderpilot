# The local stack: PostgreSQL (with pgvector), Redis, MinIO and Mailpit. The API, worker and web app join
# in P-13. Every port, name and password comes from the root .env (copy
# .env.example to .env), with the same safe defaults, so `docker compose up -d`
# works on a fresh clone.
#
#   docker compose up -d --wait     start and wait until all four are healthy
#   docker compose down             stop and remove the containers, keep the data
#
# Never add -v to `down`: it deletes the named volumes, and the data with them.
name: orderpilot

services:
  postgres:
    # PostgreSQL 18 with the pgvector extension (ADR 0017). The migrations enable
    # vector and pg_trgm.
    image: pgvector/pgvector:0.8.6-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderpilot}
      POSTGRES_DB: ${POSTGRES_DB:-orderpilot}
    ports:
      # Bound to this machine only.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-orderpilot} -d ${POSTGRES_DB:-orderpilot}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:8.2.3-alpine
    restart: unless-stopped
    # Append-only, so queued jobs survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    build:
      context: ./docker/minio
    image: orderpilot/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orderpilot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orderpilot-minio-secret}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # The only place OrderPilot sends email in development and demos (ADR 0018):
  # it catches every message and shows it in a web page. Nothing leaves the stack.
  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
