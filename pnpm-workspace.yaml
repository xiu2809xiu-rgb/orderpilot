packages:
  - apps/*
  - services/*
  - packages/*

# Supply chain. ADR 0003 records why each setting is here.

# Exact pins: `pnpm add` writes 1.2.3, never ^1.2.3.
saveExact: true
savePrefix: ""

# Refuse any version published less than 7 days (10080 minutes) ago. Most
# malicious releases are found and pulled within days. Seven days also matches
# Dependabot's cooldown, so every version Dependabot proposes can install.
minimumReleaseAge: 10080
# A fix that cannot wait 7 days goes here by exact version, with a reason and a
# review date, and comes out once it is old enough:
#   - <package>@<version> # <reason>. Review: <date>
minimumReleaseAgeExclude: []

# Fail when a new version of a package has weaker publish evidence (such as
# lost provenance) than the versions before it, a common sign of a takeover.
trustPolicy: no-downgrade

# Dependency build scripts are denied unless reviewed and listed here. pnpm
# fails the install on any unreviewed build (strictDepBuilds is on by default).
# Each entry says what the script does and why it may or may not run:
#   <package>: true # <what it does>. Reviewed: <date>
allowBuilds:
  # Checks the platform binary that tsx and Vitest use. Reviewed: 2026-10-31
  esbuild: true
  # Install-time telemetry that swagger-ui-dist pulls in. No functional effect,
  # so it stays denied. Reviewed: 2026-10-31
  "@scarf/scarf": false
  # Copies the browser service worker into a public folder. Tests run msw in
  # Node and the app never starts it, so it stays denied. Reviewed: 2026-10-31
  msw: false
  # Optional native speed-up for msgpackr (BullMQ). The pure JavaScript fallback
  # is used without it. Reviewed: 2026-10-31
  msgpackr-extract: false
  # Downloads the schema engine binary (migrations) from Prisma, which checks it
  # against a published checksum. Needed by `prisma migrate`. Reviewed: 2026-10-31
  "@prisma/engines": true
  # Prisma CLI install step. Reviewed: 2026-10-31
  prisma: true

# eslint-plugin-jsx-a11y 6.10.2, its latest release, declares ESLint up to 9.
# Its rules run correctly on ESLint 10: packages/eslint-config's tests lint a
# file with known accessibility faults and expect every one. Drop this when the
# plugin declares ESLint 10. Review: 2026-12-01.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: "10"

# Forced versions. Each entry needs a reason and a review date:
#   <selector>: <version> # <reason>. Review: <date>
overrides:
  # @nestjs/platform-express 12.1.3 pins multer 2.4.0, which has a high-severity
  # advisory (GHSA-q7qp-rjg7-q26m, fixed in 2.5.0, published 2026-10-22). The API
  # takes no uploads until P-18, but the scan is right to refuse it. Drop this
  # when @nestjs/platform-express depends on multer 2.5.0 or later.
  # Review: 2026-11-14.
  multer: 2.5.0
  # orval pulls undici 7.29.1 through @scalar/json-magic. It has high-severity
  # advisories (GHSA-qrxm-fqhp-jwvm and others, fixed in 7.30.1, published
  # 2026-10-15). orval only reads the local OpenAPI file at generate time. Drop
  # this when orval depends on undici 7.30.1 or later. Review: 2026-11-14.
  "undici@<7.30.1": 7.30.1
  # exceljs 4.4.0 (the data table'"'"'s Excel export, ADR 0023) depends on uuid 8.3.2,
  # which has a high-severity advisory (GHSA-w5hq-g745-h8pq: no bounds check when
  # a caller passes its own buffer to v3, v5 or v6; fixed in 11.1.1). exceljs only
  # calls v4 without a buffer, so it was not exposed, and its browser file is
  # prebuilt, but the scan is right to refuse it. Drop this when exceljs moves to
  # uuid 11.1.1 or later. Review: 2026-11-14.
  "uuid@<11.1.1": 11.1.1

# `pnpm audit` in the verify job fails on high or critical advisories. An
# accepted advisory goes under `ignore` by its GHSA id, with a reason and a
# review date on the line above it.
audit:
  level: high
  ignore:
    # minimatch below 11.0.1 (moderate): CPU exhaustion from an attacker's glob
    # pattern. Only dev tools reach it, with patterns we write; the fix is a new
    # major inside the release-age window. Same entry as osv-scanner.toml.
    # Review: 2026-11-14.
    - GHSA-g3hv-75wg-m249

# A transitive dependency may not come from a git URL or a tarball link, only
# from the registry. Semgrep's pnpm rules check for this.
blockExoticSubdeps: true
